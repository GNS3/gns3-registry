name: Build Docker images

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docker/**'
      - '.github/bin/docker_make'
      - '.github/workflows/build-docker-images.yml'
  schedule:
    - cron: '37 7 * * 3'
  workflow_dispatch:
    inputs:
      images:
        description: 'List of images to be built'
        required: false
        type: string

# Pause on concurrent builds
concurrency:
  group: build-docker-images

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has-images: ${{ steps.plan.outputs.has-images }}
    permissions:
      packages: write
    steps:
      - name: Check out repository code
        # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        # https://github.com/marketplace/actions/docker-setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub Registry
        # https://github.com/marketplace/actions/docker-login
        # set the condition depending on whether you want to login to Docker.
        if: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        # https://github.com/marketplace/actions/docker-login
        # set the condition depending on whether you want to login to ghcr.io.
        if: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Virtual Environment & Install python requirements
        run: |
          python3 -m venv venv
          source ./venv/bin/activate
          python3 -m pip install --requirement .github/bin/requirements.txt

      - name: Select images to build
        id: plan
        env:
          # DOCKER_REPOSITORY - Repository for name-only images
          # Using multiple repositories will build images in all of them.
          DOCKER_REPOSITORY: |
            # DockerHub:
            ${{ secrets.DOCKERHUB_REPOSITORY }}
            # GitHub Container Registry:
            ghcr.io/${{ github.repository_owner }}
          #
          # Variables whose name are starting with "DOCKER_LOGIN"
          # contain the user/password for a docker registry.
          # They are only needed to authenticate into private repositories.
          #
          # DockerHub:
          #DOCKER_LOGIN_DH: >-
          #  docker.io
          #  ${{ secrets.DOCKERHUB_USERNAME }}
          #  ${{ secrets.DOCKERHUB_TOKEN }}
          #
          # GitHub Container Registry:
          #DOCKER_LOGIN_GH: >-
          #  ghcr.io
          #  ${{ github.repository_owner }}
          #  ${{ secrets.GITHUB_TOKEN }}
          #
          IMAGES: ${{ inputs.images }}
        run: |
          source ./venv/bin/activate
          DOCKER_REPOSITORY=$(echo "$DOCKER_REPOSITORY" | sed '/^#/d')
          set -f
          set -- $IMAGES
          set +f

          # get image version
          get_image_version() {
            local image="$1"
            local platform="$2"
            docker buildx imagetools inspect --format '{{json .Image}}' "$1" | \
              jq -r --arg platform "$platform" '
                if ($platform | length) > 0 then
                  .[$platform].config.Labels["org.opencontainers.image.version"] // empty
                else
                  .config.Labels["org.opencontainers.image.version"]
                  // .["linux/amd64"].config.Labels["org.opencontainers.image.version"]
                  // empty
                end
              '
          }

          # special treatment for kalilinux: rebuild when image version changes
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            rebuild_kali=false

            basever_amd64=$(get_image_version kalilinux/kali-last-release:amd64)
            imagever_amd64=$(get_image_version gns3/kalilinux linux/amd64)
            if [ -n "$basever_amd64" ] && [ "$basever_amd64" != "$imagever_amd64" ]; then
              rebuild_kali=true
            fi

            basever_arm64=$(get_image_version kalilinux/kali-last-release:arm64)
            imagever_arm64=$(get_image_version gns3/kalilinux linux/arm64)
            if [ -n "$basever_arm64" ] && [ "$basever_arm64" != "$imagever_arm64" ]; then
              rebuild_kali=true
            fi

            if [ "$rebuild_kali" = true ]; then
              set -- "$@" kalilinux
            fi
          fi

          # use option --dir to use a subdirectory as a docker base dir
          python3 "$GITHUB_WORKSPACE/.github/bin/docker_make" --dir "docker" \
            --plan "$GITHUB_WORKSPACE/build-plan.json" "$@"
          jq -r '"has-images=\(length > 0)"' build-plan.json >> "$GITHUB_OUTPUT"

      - name: Upload build plan
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-plan
          path: build-plan.json
          retention-days: 1

  build:
    needs: prepare
    if: needs.prepare.outputs.has-images == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Download build plan
        uses: actions/download-artifact@v4
        with:
          name: docker-build-plan

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/${{ matrix.arch }}

      - name: Login to DockerHub Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install python requirements
        run: |
          python3 -m venv venv
          ./venv/bin/python -m pip install --requirement .github/bin/requirements.txt

      - name: Build and push native images
        env:
          PLATFORM: linux/${{ matrix.arch }}
          TAG_SUFFIX: build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: |
          ./venv/bin/python .github/bin/docker_make --dir docker \
            --build-plan "$GITHUB_WORKSPACE/build-plan.json" \
            --platform "$PLATFORM" --tag-suffix "$TAG_SUFFIX"

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download build plan
        uses: actions/download-artifact@v4
        with:
          name: docker-build-plan

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform images
        env:
          TAG_SUFFIX: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          jq -r '.[].target' build-plan.json | while IFS= read -r image; do
            docker buildx imagetools create --tag "$image" \
              "$image-$TAG_SUFFIX-amd64" "$image-$TAG_SUFFIX-arm64"
          done
